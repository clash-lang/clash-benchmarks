name: Publish

# This workflow makes the graphs. It runs after each new result on main,
# and on demand. The output goes to the pages branch, which GitHub Pages
# serves at https://clash-lang.github.io/clash-benchmarks/.

on:
  push:
    branches: [main]
    paths:
      - results/**
      - machines/**
      - branches/**
      - render.py
      - bench/result_schema.py
      - .github/workflows/publish.yml
  # The trigger above never sees a new result. bench/push_result.sh and
  # bench/push_branches.sh push with the GITHUB_TOKEN, and GitHub starts
  # no workflow from a push that carries that token; only a push by a
  # person reaches it. So watch the benchmark run itself as well.
  #
  # "completed", not "success": each commit pushes its own result, so a
  # run that stopped in the middle still brought new data to render.
  workflow_run:
    workflows: [Benchmark]
    types: [completed]
  workflow_dispatch:

concurrency:
  # Only the newest data matters. Cancel a render that is on the way out.
  group: publish
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    name: Render the site
    runs-on: ubuntu-latest
    permissions:
      contents: write # push_site.sh pushes to the pages branch
    steps:
      - name: Checkout clash-benchmarks
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Always the newest data. A workflow_run event points at the
          # commit that the benchmark started from, which is older than
          # the results that the benchmark went on to push.
          ref: main

      # The graphs show the first-parent commits of master, also the ones
      # that have no result yet. That order comes from git, not from the
      # results. Commits are all this clone needs, so leave the trees and
      # the blobs on the server.
      - name: Clone clash-compiler
        run: |
          git clone --filter=tree:0 --no-checkout --single-branch --branch master \
            https://github.com/clash-lang/clash-compiler.git clash-compiler
          # The release branches, and the tags that mark their releases.
          # A release branch left master before the release, so neither is
          # reachable from master and the clone above brings along
          # neither. render.py names them, so that adding one stays a
          # change to RELEASE_BRANCHES and nothing else.
          for branch in $(./render.py --release-branches); do
            git -C clash-compiler fetch --filter=tree:0 --tags origin \
              "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          done

      - name: Render
        run: ./render.py --clash-repo clash-compiler --out site/index.html

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/
          if-no-files-found: error

      - name: Push to the pages branch
        run: ./tools/push_site.sh site
